---
- name: Manage SSH hardening configuration
  hosts: managed
  become: true
  gather_facts: false

  tasks:
    - name: Manage SSH hardening configuration file
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/01-permitrootlogin.conf
        content: |
          # This file has been generated by the Anaconda Installer.
          # Allow root to log in using ssh. Remove this file to opt-out.
          PermitRootLogin no
          PasswordAuthentication no
          MaxAuthTries 3
          LoginGraceTime 30
          X11Forwarding no
        backup: true
        validate: '/usr/sbin/sshd -t -f %s'
